name: Deploy Jupyter Book

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify install
        run: |
          python --version
          pip list | grep jupyter-book

      - name: Build book
        run: |
          python -m jupyter_book build .

      - name: Verify output
        run: |
          find _build/html -name index.html
          ls -R _build/html | head -100

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4